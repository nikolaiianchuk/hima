# Copy to hima.yaml. Every key can also be set via HIMA_* environment
# variables (e.g. HIMA_AUTH_MODE), which take precedence.

# Public URL used when building Invite and Manage links.
base_url: https://hima.example.com

# Defaults to 127.0.0.1:8080 in proxy mode and :8080 in password mode.
# In Docker with proxy mode, set it explicitly (e.g. ":8080").
# listen: 127.0.0.1:8080

database: hima.db

owner:
  name: Nikolai
  # Your addresses as they appear in meeting invitations. Used only to spot
  # invitations you declined, so they don't block Slots. Never shown to Guests.
  # emails: [you@example.com, you@work.example.com]

auth:
  # Required, no default — hima refuses to start without it (docs/adr/0002).
  #   proxy    — your reverse proxy (Authelia, Tailscale, …) protects /admin
  #   password — built-in login
  mode: proxy

  # proxy mode: optionally require a header your proxy sets.
  # proxy_header: Remote-User

  # password mode: generate with `hima hash-password`.
  # password_hash: $2a$10$...

# When you can be booked. Hours are wall-clock time in `timezone`.
availability:
  timezone: Europe/Lisbon
  weekly:               # mon..sun; omitted days are unavailable
    mon: ["10:00-18:00"]
    tue: ["10:00-18:00"]
    wed: ["10:00-18:00"]
    thu: ["10:00-18:00"]
    fri: ["10:00-13:00", "15:00-18:00"]
  buffer: 15m           # kept free around every busy block
  min_notice: 12h       # earliest a Slot may start from now
  horizon_days: 30      # how far ahead Guests can book
  step: 30m             # spacing between Slot start times

# Pre-filled values for the "new Invite" form.
invite_defaults:
  expires_in_days: 7
  max_uses: 1
  durations: [30m]        # offer several, e.g. [30m, 1h]
  location: ""            # e.g. a Jitsi link or "Café Nicola"

# Where to tell you about new bookings, reschedules, cancellations and
# calendars that can't be read. Both are optional; everything also appears
# in the admin's activity log.
notifications:
  ntfy:
    url: ""               # e.g. https://ntfy.sh/pick-a-long-random-topic
    token: ""             # for protected topics
  webhook:
    url: ""               # receives a JSON POST per event

# Calendar sources: private ICS URLs. Everything in them counts as busy,
# except events marked "free". (For webcal:// links, use https:// instead.)
calendars:
  - url: https://calendar.google.com/calendar/ical/.../basic.ics
    all_day_blocks: false   # true: all-day events (holidays, trips) block the day
